<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween Crawl Madrid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Layout: one dark card over a Madrid night. Player view = stop badge, riddle, answer, reveal. Admin view = stacked stop editors. Single committed dark look. */
  :root {
    --bg: #110a18;
    --bg-glow: #2a1038;
    --card: #1b1124;
    --card-2: #140c1c;
    --line: #3a2449;
    --fg: #efe4cf;
    --muted: #a894b8;
    --pumpkin: #ff7a1a;
    --pumpkin-deep: #c2500a;
    --toxic: #9dff5c;
    --blood: #e0243a;
    --display: 'Pirata One', 'Impact', serif;
    --body: 'Crimson Pro', Georgia, serif;
    --mono: 'Courier Prime', 'Courier New', monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 1.15rem;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: clamp(20px, 6vh, 56px) 40px;
  }
  .page { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
  .page.wide { max-width: 760px; }

  .badge {
    display: inline-flex; gap: 10px; align-items: baseline;
    font-family: var(--mono); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); justify-self: center;
  }
  .badge b { color: var(--pumpkin); font-weight: 700; }

  h1 {
    margin: 0; text-align: center; text-wrap: balance;
    font-family: var(--display); font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: .95;
    color: var(--pumpkin);
    text-shadow: 0 0 24px rgba(255,122,26,.35), 0 2px 0 var(--pumpkin-deep);
  }
  h2 { font-family: var(--display); font-weight: 400; font-size: 1.8rem; margin: 0; color: var(--pumpkin); }
  .sub { text-align: center; color: var(--muted); margin: 0; font-style: italic; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 22px; display: grid; gap: 18px; min-width: 0;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.9);
  }
  .riddle { margin: 0; white-space: pre-line; font-size: 1.25rem; }

  form { display: grid; gap: 10px; margin: 0; }
  label { font-family: var(--mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: grid; gap: 5px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=url], input[type=number], textarea {
    width: 100%; min-width: 0;
    font: inherit; font-size: 1.05rem;
    padding: 10px 12px; border-radius: 4px;
    background: #0d0713; color: var(--fg); border: 1px solid var(--line);
  }
  textarea { min-height: 90px; resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus { outline: 2px solid var(--pumpkin); outline-offset: 1px; border-color: var(--pumpkin); }
  #answer { flex: 1 1 180px; font-family: var(--mono); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .06em; width: auto; }
  button {
    font-family: var(--display); font-size: 1.3rem; letter-spacing: .04em;
    padding: 9px 20px; border-radius: 4px; border: 0; cursor: pointer;
    background: var(--pumpkin); color: #1a0a00;
  }
  button:hover { background: #ff8e3d; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 1rem; padding: 6px 12px; }
  button.ghost:hover { color: var(--fg); border-color: var(--muted); }
  button.danger { color: var(--blood); border-color: var(--blood); }
  button:disabled { opacity: .5; cursor: default; }

  .msg { font-family: var(--mono); font-size: .9rem; min-height: 1.3em; margin: 0; color: var(--blood); }
  .msg.hint { color: var(--muted); }
  .msg.ok { color: var(--toxic); }

  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

  .reveal {
    border: 1px dashed var(--toxic); border-radius: 6px; padding: 22px 20px; display: grid; gap: 10px; text-align: center;
    background: rgba(157,255,92,.05);
    animation: rise .5s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .eyebrow { font-family: var(--mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--toxic); }
  .reveal .where { font-family: var(--display); font-size: clamp(2rem, 8vw, 3rem); line-height: 1; color: var(--fg); margin: 0; text-wrap: balance; }
  .reveal .note { margin: 0; color: var(--muted); white-space: pre-line; }
  a { color: var(--toxic); font-family: var(--mono); font-size: .9rem; letter-spacing: .06em; }

  footer { text-align: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* admin */
  .stop { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px; display: grid; gap: 14px; min-width: 0; }
  .stop header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stop .num { font-family: var(--display); font-size: 1.6rem; color: var(--pumpkin); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .small { font-family: var(--mono); font-size: .78rem; color: var(--muted); letter-spacing: .04em; text-transform: none; }
  .qrbox { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; background: var(--card-2); border-radius: 4px; padding: 12px; }
  .qrbox .qr { width: 112px; height: 112px; flex: none; }
  .qrbox .qr img, .qrbox .qr canvas { display: block; width: 112px !important; height: 112px !important; }
  .qrbox div { min-width: 0; display: grid; gap: 6px; }
  .qrbox code { font-family: var(--mono); font-size: .8rem; word-break: break-all; color: var(--fg); }
  .savebar {
    position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg); border-top: 1px solid var(--line); padding-block: 12px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .toast { font-family: var(--mono); font-size: .85rem; color: var(--toxic); }
  .toast.err { color: var(--blood); }
  @media (prefers-reduced-motion: reduce) { .shake, .reveal { animation: none; } }
</style>

</head>
<body>
<main class="page" id="app">
  <div class="badge"><b>Halloween Crawl</b> <span>Madrid</span></div>
  <h1>Scan a code to begin</h1>
  <p class="sub">Each hidden QR opens a riddle. Solve it to learn the next bar.</p>
  <footer>Halloween Crawl · Madrid</footer>
</main>

<script>
(function () {
  // ---- where this game lives on GitHub (the admin panel commits here) ----
  var OWNER = 'virasonic', REPO = 'halloween-crawl', BRANCH = 'main', STATE_PATH = 'state.json';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + STATE_PATH;

  var STATE = null;
  var app = document.getElementById('app');
  var LS_ANS = 'hcrawl-answers';   // owner's device only: plaintext answers shown in the admin panel
  var LS_TOKEN = 'hcrawl-gh-token'; // owner's device only: GitHub token for publishing

  // ---------- helpers ----------
  function norm(s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  async function sha256(s) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function token() { var a = 'abcdefghijklmnopqrstuvwxyz0123456789', r = '', b = crypto.getRandomValues(new Uint8Array(8)); for (var i = 0; i < 8; i++) r += a[b[i] % a.length]; return r; }
  function baseUrl() { return location.href.split('#')[0]; }
  function stopUrl(t) { return baseUrl() + '#' + t; }
  function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function fromB64utf8(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); }

  // ---------- load state: GitHub API first (fresh), then the copy next to this page ----------
  async function loadState() {
    try {
      var r = await fetch(API + '?ref=' + BRANCH, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) {}
    var r2 = await fetch(STATE_PATH + '?t=' + Date.now(), { cache: 'no-store' });
    return await r2.json();
  }

  // ---------- routing ----------
  function route() {
    var h = (location.hash || '').slice(1);
    if (h === 'admin') return renderAdmin();
    var idx = STATE.stops.findIndex(function (s) { return s.token === h; });
    if (idx !== -1) return renderStop(idx);
    renderHome();
  }
  window.addEventListener('hashchange', route);

  function renderHome() {
    app.className = 'page';
    app.innerHTML =
      '<div class="badge"><b>' + esc(STATE.title) + '</b> <span>Madrid</span></div>' +
      '<h1>Scan a code to begin</h1>' +
      '<p class="sub">Each hidden QR opens a riddle. Solve it to learn the next bar.</p>' +
      '<footer>' + esc(STATE.title) + ' · Madrid · ' + esc(STATE.year) + '</footer>';
  }

  // ---------- player view ----------
  function renderStop(idx) {
    var s = STATE.stops[idx], n = idx + 1, total = STATE.stops.length;
    var KEY = 'hcrawl-solved-' + s.token;
    var link = s.next_link ? '<a href="' + esc(s.next_link) + '" target="_blank" rel="noopener">Open in maps ↗</a>' : '';
    app.className = 'page';
    app.innerHTML =
      '<div class="badge"><b>Parada ' + n + '</b> <span>de ' + total + '</span></div>' +
      '<h1>' + esc(s.heading) + '</h1>' +
      '<p class="sub">' + esc(s.subheading) + '</p>' +
      '<section class="card" id="card">' +
        '<p class="riddle">' + esc(s.riddle) + '</p>' +
        '<form id="f" autocomplete="off">' +
          '<label for="answer">Your answer</label>' +
          '<div class="row"><input type="text" id="answer" name="answer" placeholder="…" autocapitalize="characters" spellcheck="false" required>' +
          '<button type="submit" id="go">Reveal</button></div>' +
          '<p class="msg" id="msg" aria-live="polite"></p>' +
        '</form>' +
      '</section>' +
      '<section class="reveal" id="reveal" hidden>' +
        '<div class="eyebrow">Next stop</div>' +
        '<p class="where">' + esc(s.next_name) + '</p>' +
        '<p class="note">' + esc(s.next_note) + '</p>' + link +
      '</section>' +
      '<footer>' + esc(STATE.title) + ' · Madrid · ' + esc(STATE.year) + '</footer>';

    var form = document.getElementById('f'), input = document.getElementById('answer'), msg = document.getElementById('msg');
    var card = document.getElementById('card'), reveal = document.getElementById('reveal'), tries = 0;
    function solve() { card.hidden = true; reveal.hidden = false; lsSet(KEY, 1); }
    if (lsGet(KEY) === 1) solve();
    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var v = norm(input.value); if (!v) return;
      var h = await sha256(v);
      if (s.hashes.indexOf(h) !== -1) { solve(); return; }
      tries++;
      msg.className = 'msg';
      msg.textContent = ['Wrong. The spirits laugh.', 'Still wrong. Drink and think.', 'No. Try harder, mortal.'][Math.min(tries - 1, 2)];
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      if (s.hint && tries >= (s.hint_after || 3)) { msg.className = 'msg hint'; msg.textContent = 'Hint: ' + s.hint; }
      input.select();
    });
  }

  // ---------- admin ----------
  function renderAdmin() {
    app.className = 'page wide';
    app.innerHTML =
      '<div class="badge"><b>Host panel</b> <span>' + esc(STATE.title) + '</span></div>' +
      '<h1>Control the crawl</h1>' +
      '<section class="card" id="gate">' +
        '<p class="sub" style="text-align:left">Publishing commits to <code class="small">' + OWNER + '/' + REPO + '</code>. Paste a GitHub token with write access to that repo. It stays in this browser only.</p>' +
        '<form id="tokform"><label for="tok">GitHub token</label><div class="row"><input type="password" id="tok" style="flex:1 1 200px;width:auto;font-family:var(--mono)" placeholder="github_pat_…" autocomplete="off">' +
        '<button type="submit">Unlock</button></div><p class="msg" id="tokmsg"></p></form>' +
      '</section>' +
      '<div id="adminbody" hidden></div>';
    var tokform = document.getElementById('tokform'), tokmsg = document.getElementById('tokmsg');
    var saved = lsGet(LS_TOKEN);
    if (saved) { document.getElementById('tok').value = saved; }
    tokform.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var t = document.getElementById('tok').value.trim();
      if (!t) return;
      tokmsg.className = 'msg'; tokmsg.textContent = 'Checking…';
      try {
        var r = await fetch(API + '?ref=' + BRANCH, { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (!r.ok) throw new Error(r.status === 401 ? 'Token rejected.' : r.status === 404 ? 'Token cannot see the repo (check it has Contents access to ' + REPO + ').' : 'GitHub answered ' + r.status + '.');
        var meta = await r.json();
        lsSet(LS_TOKEN, t);
        document.getElementById('gate').hidden = true;
        buildAdmin(t, meta.sha, JSON.parse(fromB64utf8(meta.content)));
      } catch (e) { tokmsg.textContent = e.message; }
    });
    if (saved) tokform.requestSubmit();
  }

  function buildAdmin(tok, sha, live) {
    var body = document.getElementById('adminbody'); body.hidden = false;
    var draft = JSON.parse(JSON.stringify(live));
    var plain = lsGet(LS_ANS) || {};

    function render() {
      body.innerHTML = '';
      body.appendChild(el(
        '<section class="stop"><div class="grid2">' +
          '<label>Game title<input type="text" id="g-title" value="' + esc(draft.title) + '"></label>' +
          '<label>Year<input type="text" id="g-year" value="' + esc(draft.year) + '"></label>' +
        '</div></section>'));
      document.getElementById('g-title').oninput = function () { draft.title = this.value; };
      document.getElementById('g-year').oninput = function () { draft.year = this.value; };

      draft.stops.forEach(function (s, i) {
        var node = el(
          '<section class="stop" data-i="' + i + '">' +
            '<header><span class="num">Parada ' + (i + 1) + ' <span class="small">→ reveals ' + (i + 1 < draft.stops.length ? 'Parada ' + (i + 2) : 'the final bar') + '</span></span>' +
              '<span class="row"><button class="ghost" data-act="up" type="button" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
              '<button class="ghost" data-act="down" type="button" ' + (i === draft.stops.length - 1 ? 'disabled' : '') + '>↓</button>' +
              '<button class="ghost danger" data-act="del" type="button">Delete</button></span></header>' +
            '<div class="qrbox"><div class="qr" id="qr-' + i + '"></div><div>' +
              '<span class="small">This QR is hidden in the bar BEFORE this riddle. It opens:</span>' +
              '<code>' + esc(stopUrl(s.token)) + '</code>' +
              '<span class="row"><a href="' + esc(stopUrl(s.token)) + '" target="_blank" rel="noopener">Open as player ↗</a>' +
              '<button class="ghost" data-act="copy" type="button">Copy link</button></span>' +
            '</div></div>' +
            '<div class="grid2">' +
              '<label>Heading<input type="text" data-k="heading" value="' + esc(s.heading) + '"></label>' +
              '<label>Subheading<input type="text" data-k="subheading" value="' + esc(s.subheading) + '"></label>' +
            '</div>' +
            '<label>Riddle / fill the blank<textarea data-k="riddle">' + esc(s.riddle) + '</textarea></label>' +
            '<label>Accepted answers, comma separated <span class="small">(' + s.hashes.length + ' set · case, accents and punctuation ignored · leave empty to keep)</span>' +
              '<input type="text" data-k="_answers" value="' + esc(plain[s.token] || '') + '" placeholder="e.g. bottle, botella"></label>' +
            '<div class="grid2">' +
              '<label>Hint (optional)<input type="text" data-k="hint" value="' + esc(s.hint) + '"></label>' +
              '<label>Show hint after N wrong tries<input type="number" min="1" data-k="hint_after" value="' + esc(s.hint_after || 3) + '"></label>' +
            '</div>' +
            '<label>Reveal: next bar name or cryptic clue<input type="text" data-k="next_name" value="' + esc(s.next_name) + '"></label>' +
            '<label>Reveal note (optional)<textarea data-k="next_note">' + esc(s.next_note) + '</textarea></label>' +
            '<label>Maps link (optional, for coordinates)<input type="url" data-k="next_link" value="' + esc(s.next_link) + '" placeholder="https://maps.google.com/?q=40.41,-3.70"></label>' +
          '</section>');
        body.appendChild(node);
        node.querySelectorAll('[data-k]').forEach(function (inp) {
          inp.oninput = function () {
            var k = inp.dataset.k;
            if (k === '_answers') { s._answers = inp.value; }
            else if (k === 'hint_after') { s.hint_after = parseInt(inp.value, 10) || 3; }
            else s[k] = inp.value;
          };
        });
        node.querySelectorAll('[data-act]').forEach(function (b) {
          b.onclick = function () {
            var act = b.dataset.act;
            if (act === 'copy') { navigator.clipboard.writeText(stopUrl(s.token)).then(function () { b.textContent = 'Copied'; }).catch(function () { b.textContent = 'Select the link above'; }); return; }
            if (act === 'del') { if (b.textContent !== 'Really delete?') { b.textContent = 'Really delete?'; return; } draft.stops.splice(i, 1); }
            if (act === 'up') { draft.stops.splice(i - 1, 0, draft.stops.splice(i, 1)[0]); }
            if (act === 'down') { draft.stops.splice(i + 1, 0, draft.stops.splice(i, 1)[0]); }
            render();
          };
        });
        if (window.QRCode) new QRCode(document.getElementById('qr-' + i), { text: stopUrl(s.token), width: 224, height: 224, colorDark: '#1a0a00', colorLight: '#ff7a1a', correctLevel: QRCode.CorrectLevel.H });
      });

      body.appendChild(el('<div class="row"><button class="ghost" id="add" type="button">+ Add a stop</button></div>'));
      document.getElementById('add').onclick = function () {
        draft.stops.push({ token: token(), heading: 'New stop', subheading: '', riddle: '', hashes: [], hint: '', hint_after: 3, next_name: '', next_note: '', next_link: '' });
        render();
      };
      body.appendChild(el(
        '<div class="savebar"><button id="save" type="button">Save &amp; publish</button>' +
        '<button class="ghost" id="forget" type="button">Forget token</button>' +
        '<span class="toast" id="toast"></span></div>'));
      document.getElementById('save').onclick = save;
      document.getElementById('forget').onclick = function () { try { localStorage.removeItem(LS_TOKEN); } catch (e) {} location.reload(); };
    }

    async function save() {
      var btn = document.getElementById('save'), toast = document.getElementById('toast');
      btn.disabled = true; toast.className = 'toast'; toast.textContent = 'Hashing answers…';
      var newPlain = Object.assign({}, plain);
      for (var i = 0; i < draft.stops.length; i++) {
        var s = draft.stops[i];
        if (s._answers != null && s._answers.trim()) {
          var list = s._answers.split(',').map(norm).filter(Boolean);
          var hs = []; for (var j = 0; j < list.length; j++) hs.push(await sha256(list[j]));
          s.hashes = hs.filter(function (h, k) { return hs.indexOf(h) === k; }).sort();
          newPlain[s.token] = list.join(', ');
        }
        delete s._answers;
      }
      if (draft.stops.some(function (s) { return !s.hashes.length; })) {
        toast.className = 'toast err'; toast.textContent = 'Every stop needs at least one accepted answer.'; btn.disabled = false; return;
      }
      toast.textContent = 'Publishing…';
      try {
        var r = await fetch(API, {
          method: 'PUT',
          headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Update crawl from admin panel', content: b64utf8(JSON.stringify(draft, null, 2) + '\n'), sha: sha, branch: BRANCH })
        });
        if (r.status === 409) throw new Error('Someone else saved in between. Reload and redo your edit.');
        if (!r.ok) throw new Error('GitHub answered ' + r.status + '.');
        var out = await r.json();
        sha = out.content.sha; live = draft; STATE = JSON.parse(JSON.stringify(draft)); plain = newPlain; lsSet(LS_ANS, newPlain);
        draft = JSON.parse(JSON.stringify(live));
        render();
        document.getElementById('toast').textContent = 'Published. Players see it on their next scan.';
      } catch (e) {
        toast.className = 'toast err'; toast.textContent = 'Could not publish: ' + e.message; btn.disabled = false;
      }
    }

    render();
  }

  loadState().then(function (s) { STATE = s; route(); }).catch(function () {
    app.innerHTML = '<h1>Could not load the game</h1><p class="sub">Check your connection and reload.</p>';
  });
})();
</script>
</body>
</html>
